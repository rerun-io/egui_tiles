# https://release-plz.dev/docs/github/quickstart
#
# Publishes to crates.io, pushes the `<crate>-v<version>` tag and opens the
# GitHub release, for every crate whose version in `Cargo.toml` is not on
# crates.io yet.
#
# It does not propose version bumps: there is no `release-pr` step. You bump the
# version and update the changelog as part of the release commit — see
# RELEASES.md, and the note in release-plz.toml for why.
name: Release-plz

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release-plz reads the history to find the last release
          lfs: true

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0

      - name: Publish released crates
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
