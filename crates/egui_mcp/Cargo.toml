[package]
name = "egui_mcp"
version = "0.2.0"
authors = ["Lucas Meurer <hi@lucasmerlin.me>"]
description = "MCP server that drives live egui apps over the egui_inspection protocol"
edition.workspace = true
rust-version.workspace = true
homepage = "https://github.com/rerun-io/egui_tiles"
license.workspace = true
readme = "README.md"
repository = "https://github.com/rerun-io/egui_tiles"
categories = ["gui", "development-tools::testing"]
keywords = ["egui", "mcp", "accesskit", "inspector", "testing"]
include = ["../../LICENSE-APACHE", "../../LICENSE-MIT", "**/*.rs", "Cargo.toml"]
publish = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[[bin]]
name = "egui-mcp"
path = "src/main.rs"

[dependencies]
egui.workspace = true
egui_inspection.workspace = true
accesskit.workspace = true
accesskit_consumer.workspace = true
base64.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
