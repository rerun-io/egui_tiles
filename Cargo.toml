[workspace]
members = ["crates/egui_tiles", "crates/egui_table", "crates/egui_table_demo"]
resolver = "3"

# NOTE: `crates/kittest_inspector` and `crates/egui_mcp` are a workspace of their own, rooted
# in `crates/kittest_inspector/Cargo.toml`. The `kittest_inspector` crate rides the
# `lucas/kittest-inspect` branch of egui (old `inspector_api` protocol), while `egui_mcp` is on
# crates.io egui 0.36 (new `egui_inspection` protocol). Cargo allows one source per semver range
# per workspace and `[patch]` is workspace-global, so those two cannot share this lockfile.
# Fold them back in once both sit on a released egui.
exclude = ["crates/kittest_inspector", "crates/egui_mcp"]


[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95.0" # The highest MSRV of the crates in this repo


[workspace.dependencies]
egui_table = { version = "0.10.0", path = "crates/egui_table", default-features = false }
egui_tiles = { version = "0.17.1", path = "crates/egui_tiles", default-features = false }

eframe = { version = "0.36.0", default-features = false }
egui = { version = "0.36.0", default-features = false }
egui_kittest = { version = "0.36.0" }
env_logger = { version = "0.11.8", default-features = false, features = [
  "auto-color",
  "humantime",
] }
log = { version = "0.4.29", features = ["std"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
vec1 = { version = "1.12.1", default-features = false }
wasm-bindgen-futures = "0.4.64"
web-sys = "0.3.91"


[profile.release]
opt-level = 2 # fast and small wasm


[patch.crates-io]
# Useful while developing:

# eframe = { git = "https://github.com/emilk/egui.git", branch = "main" }
# egui = { git = "https://github.com/emilk/egui.git", branch = "main" }

# eframe = { path = "../egui/crates/eframe" }
# egui = { path = "../egui/crates/egui" }
# egui_kittest = { path = "../egui/crates/egui_kittest" }


# ----------------------------------------------------------------------------------------
# Lints:

[workspace.lints.rust]
unsafe_code = "deny"

elided_lifetimes_in_paths = "warn"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_prelude_collisions = "warn"
semicolon_in_expressions_from_macros = "warn"
trivial_numeric_casts = "warn"
unexpected_cfgs = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"

trivial_casts = "allow"
unused_qualifications = "allow"

[workspace.lints.rustdoc]
all = "warn"
broken_intra_doc_links = "warn"
missing_crate_level_docs = "warn"

# See also clippy.toml
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

allow_attributes = "warn"
as_ptr_cast_mut = "warn"
await_holding_lock = "warn"
branches_sharing_code = "warn"
char_lit_as_u8 = "warn"
clear_with_drain = "warn"
clone_on_ref_ptr = "warn"
coerce_container_to_any = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
default_union_representation = "warn"
derive_partial_eq_without_eq = "warn"
disallowed_macros = "warn" # See clippy.toml
disallowed_methods = "warn" # See clippy.toml
disallowed_names = "warn" # See clippy.toml
disallowed_script_idents = "warn" # See clippy.toml
disallowed_types = "warn" # See clippy.toml
doc_include_without_cfg = "warn"
empty_enum_variants_with_brackets = "warn"
empty_line_after_outer_attr = "warn"
equatable_if_let = "warn"
exit = "warn"
fallible_impl_from = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
if_let_mutex = "warn"
implied_bounds_in_impls = "warn"
imprecise_flops = "warn"
infinite_loop = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_over_hash_type = "warn"
large_include_file = "warn"
large_stack_frames = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
let_unit_value = "warn"
literal_string_with_formatting_args = "warn"
lossy_float_literal = "warn"
manual_clamp = "warn"
manual_ilog2 = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
map_flatten = "warn"
mem_forget = "warn"
missing_assert_message = "warn"
missing_enforced_import_renames = "warn"
missing_safety_doc = "warn"
mixed_attributes_style = "warn"
mutex_integer = "warn"
needless_borrow = "warn"
needless_pass_by_ref_mut = "warn"
needless_type_cast = "warn"
negative_feature_names = "warn"
non_zero_suggestions = "warn"
nonstandard_macro_braces = "warn"
only_used_in_recursion = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
pathbuf_init_then_push = "warn"
precedence_bits = "warn"
print_stderr = "warn"
print_stdout = "warn"
pub_without_shorthand = "warn"
rc_mutex = "warn"
readonly_write_lock = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
set_contains_or_insert = "warn"
single_option_map = "warn"
str_to_string = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
string_lit_chars_any = "warn"
suspicious_command_arg_space = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "warn"
too_long_first_doc_paragraph = "warn"
too_many_arguments = "warn"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
tuple_array_conversions = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
uninhabited_references = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unnecessary_struct_initialization = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
unused_trait_names = "warn"
unwrap_used = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
useless_transmute = "warn"
verbose_file_reads = "warn"
wildcard_dependencies = "warn"

# Pedantic lints we opt out of, with the number of hits at the time we enabled `pedantic`.
# Lints that were already enabled here one-by-one are kept on.
cast_lossless = "allow" # 1 hit
cast_precision_loss = "allow" # 12 hits
cast_sign_loss = "allow"
default_trait_access = "allow" # 8 hits
float_cmp = "allow" # exact float comparisons are usually intentional (`float_cmp_const` is still on)
inline_always = "allow" # we know what we are doing
items_after_statements = "allow" # 1 hit
many_single_char_names = "allow" # `r, g, b, a` and `h, s, v` are fine
missing_panics_doc = "allow"
must_use_candidate = "allow" # 39 hits
redundant_closure_for_method_calls = "allow" # 1 hit
return_self_not_must_use = "allow"
similar_names = "allow" # too many false positives, e.g. `encoder`/`encoded`
struct_excessive_bools = "allow" # 2 hits
struct_field_names = "allow" # 1 hit
trivially_copy_pass_by_ref = "allow" # 6 hits
unreadable_literal = "allow" # 1 hit
used_underscore_binding = "allow" # 2 hits

# These are meh:
assigning_clones = "allow" # No please
manual_range_contains = "allow" # this one is just worse imho
map_unwrap_or = "allow" # so is this one

# NOTE: these are in `restriction`/`nursery`, so the `allow` is a no-op today.
# We keep them to record our intent in case we ever enable those groups.
self_named_module_files = "allow" # Disabled waiting on https://github.com/rust-lang/rust-clippy/issues/9602
significant_drop_tightening = "allow" # Too many false positives
