name: Cargo Shear

on:
  push:
    branches:
      - "main"
  pull_request:
    types: [opened, synchronize]

jobs:
  cargo-shear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cargo Shear
        uses: taiki-e/install-action@v2.48.7
        with:
          tool: cargo-shear@1.1.11

      - name: Run Cargo Shear
        run: |
          cargo shear

      # `crates/kittest_inspector` and `crates/egui_mcp` are a workspace of their own.
      # See the NOTE in the root Cargo.toml.
      - name: Run Cargo Shear (kittest_inspector workspace)
        run: |
          cargo shear --path crates/kittest_inspector
